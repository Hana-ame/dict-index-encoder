<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="词典编号编码器：数字 / 字母 / 中文三模式，中文模式使用 2 万字码表覆盖 3K+ 常用汉字，一个汉字对应一个密文字符，双向可逆。" />
<title>词典编号编码器 · 中文码表 2 万字</title>
<style>
  :root {
    --bg: #0a0f1f;
    --card: rgba(255,255,255,.045);
    --border: rgba(255,255,255,.10);
    --text: #e9edfa;
    --muted: #8c97ba;
    --accent: #5b8cff;
    --accent2: #22d3ee;
    --danger: #f0506e;
    --violet: #a78bfa;
    --green: #34d399;
    --radius: 16px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(1100px 560px at 8% -12%, rgba(91,140,255,.22), transparent 62%),
      radial-gradient(900px 480px at 108% 6%, rgba(34,211,238,.16), transparent 62%),
      var(--bg);
    background-attachment: fixed;
    padding: clamp(14px, 3.5vw, 40px);
  }

  .wrap { max-width: 1080px; margin: 0 auto; }

  header { text-align: center; margin-bottom: clamp(18px, 3vw, 30px); }

  h1 {
    margin: 0 0 8px;
    font-size: clamp(1.35rem, 4.5vw, 2rem);
    letter-spacing: .02em;
    background: linear-gradient(100deg, #ffffff, #9db4ff 45%, #5be0f0);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .sub {
    margin: 0;
    color: var(--muted);
    font-size: clamp(.78rem, 2.6vw, .92rem);
    line-height: 1.6;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: clamp(14px, 2.6vw, 22px);
    margin-bottom: clamp(12px, 2.2vw, 18px);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  .card h2 {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin: 0 0 14px;
    font-size: .8rem;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .card h2::before {
    content: "";
    width: 3px;
    height: 14px;
    border-radius: 2px;
    background: linear-gradient(180deg, var(--accent), var(--accent2));
  }

  .stat-inline {
    margin-left: auto;
    font-size: .72rem;
    letter-spacing: 0;
    text-transform: none;
    color: var(--muted);
    font-weight: 400;
  }

  .stat-inline b { color: var(--accent2); font-weight: 700; }

  /* ---------- 分段控件 ---------- */
  .segmented {
    display: inline-flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 4px;
    background: rgba(0,0,0,.32);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 16px;
  }

  .segmented button {
    appearance: none;
    border: 0;
    background: transparent;
    font: inherit;
    font-size: .84rem;
    font-weight: 600;
    color: var(--muted);
    padding: 9px 16px;
    border-radius: 9px;
    cursor: pointer;
    white-space: nowrap;
    transition: background .2s, color .2s, transform .1s;
  }

  .segmented button:hover { color: var(--text); }
  .segmented button:active { transform: scale(.97); }

  .segmented button.active {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #06101f;
    box-shadow: 0 4px 14px rgba(91,140,255,.35);
  }

  /* ---------- 双输入框 ---------- */
  .io-grid {
    display: grid;
    grid-template-columns: 1fr 40px 1fr;
    gap: 10px;
    align-items: stretch;
  }

  .arrow {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.35rem;
    font-weight: 700;
    color: var(--accent2);
    user-select: none;
  }

  .field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }

  .field label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    font-size: .76rem;
    font-weight: 600;
    letter-spacing: .08em;
    color: var(--muted);
  }

  .field label .tag {
    font-weight: 400;
    font-size: .72rem;
    letter-spacing: 0;
    color: #68729a;
    white-space: nowrap;
  }

  .field textarea {
    width: 100%;
    min-height: 190px;
    padding: 13px 14px;
    resize: vertical;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: rgba(0,0,0,.28);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 16px;
    line-height: 1.7;
    letter-spacing: .04em;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
    word-break: break-all;
    white-space: pre-wrap;
  }

  .field textarea::placeholder { color: #5c6688; }

  .field textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(91,140,255,.16);
  }

  #plainText { text-transform: lowercase; }
  #plainText.chinese-mode { text-transform: none; letter-spacing: .08em; font-size: 17px; }
  #cipherText { color: #a7ecf8; letter-spacing: .08em; }
  #cipherText.chinese-mode { font-size: 17px; letter-spacing: .12em; }

  /* ---------- 按钮 ---------- */
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }

  .btn {
    appearance: none;
    cursor: pointer;
    font: inherit;
    font-size: .82rem;
    font-weight: 600;
    padding: 9px 18px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,.06);
    color: var(--text);
    transition: background .2s, border-color .2s, transform .1s, box-shadow .2s;
  }

  .btn:hover { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.22); }
  .btn:active { transform: scale(.97); }

  .btn-copy-plain {
    background: linear-gradient(135deg, #3b6fe0, #5b8cff);
    border-color: transparent;
    color: #f0f6ff;
    box-shadow: 0 4px 14px rgba(59,111,224,.35);
  }
  .btn-copy-plain:hover {
    background: linear-gradient(135deg, #4a7ef0, #6f9bff);
    box-shadow: 0 6px 18px rgba(59,111,224,.45);
  }

  .btn-copy-cipher {
    background: linear-gradient(135deg, #0ea5c4, #22d3ee);
    border-color: transparent;
    color: #04141b;
    box-shadow: 0 4px 14px rgba(34,211,238,.35);
  }
  .btn-copy-cipher:hover {
    background: linear-gradient(135deg, #1cb9d8, #4bdef5);
    box-shadow: 0 6px 18px rgba(34,211,238,.45);
  }

  .btn-shuffle {
    background: linear-gradient(135deg, #7c3aed, #a78bfa);
    border-color: transparent;
    color: #f5f3ff;
    box-shadow: 0 4px 14px rgba(139,92,246,.35);
  }
  .btn-shuffle:hover {
    background: linear-gradient(135deg, #8b5cf6, #c4b5fd);
    box-shadow: 0 6px 18px rgba(139,92,246,.45);
  }

  .btn-danger {
    color: var(--danger);
    border-color: rgba(240,80,110,.35);
    background: rgba(240,80,110,.08);
  }
  .btn-danger:hover {
    background: rgba(240,80,110,.16);
    border-color: rgba(240,80,110,.55);
  }

  /* ---------- 词表 ---------- */
  .word-table {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 8px;
    max-height: 420px;
    overflow-y: auto;
    padding-right: 4px;
  }

  .word-entry {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-radius: 8px;
    background: rgba(255,255,255,.035);
    border: 1px solid rgba(255,255,255,.07);
    font-family: ui-monospace, monospace;
    font-size: .82rem;
    transition: background .18s, border-color .18s;
  }

  .word-entry:hover {
    background: rgba(91,140,255,.10);
    border-color: rgba(91,140,255,.30);
  }

  .word-id {
    color: var(--accent2);
    font-weight: 700;
    min-width: 54px;
    font-size: .78rem;
  }

  .word-text {
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .empty {
    color: var(--muted);
    font-size: .82rem;
    text-align: center;
    padding: 24px 0;
    grid-column: 1 / -1;
  }

  .note {
    margin-top: 12px;
    font-size: .76rem;
    line-height: 1.6;
    color: var(--muted);
  }
  .note strong { color: var(--accent2); font-weight: 600; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translate(-50%, 20px);
    padding: 10px 20px;
    border-radius: 12px;
    background: rgba(20,28,50,.95);
    border: 1px solid var(--border);
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
    font-size: .85rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity .28s, transform .28s;
    z-index: 99;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 760px) {
    .io-grid { grid-template-columns: 1fr; }
    .arrow { height: 22px; transform: rotate(90deg); }
    .field textarea { min-height: 150px; }
  }

  @media (max-width: 520px) {
    .btn { flex: 1; text-align: center; }
    .segmented { display: flex; width: 100%; }
    .segmented button { flex: 1; text-align: center; padding: 9px 6px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>词典编号编码器</h1>
    <p class="sub">数字 / 字母 / 中文三模式 · 中文码表 20992 字（覆盖 3K+ 常用字） · 一个汉字对应一个密文字符 · 双向可逆</p>
  </header>

  <!-- 原文 / 密文 -->
  <section class="card">
    <h2>原文 / 密文</h2>

    <div class="segmented" role="tablist" aria-label="密文模式">
      <button class="active" data-mode="number" role="tab">数字模式</button>
      <button data-mode="letter" role="tab">字母模式</button>
      <button data-mode="chinese" role="tab">中文模式</button>
    </div>

    <div class="io-grid">
      <div class="field">
        <label>
          <span>原文</span>
          <span class="tag" id="plainCount">0 字符</span>
        </label>
        <textarea id="plainText" spellcheck="false" autocomplete="off"
                  placeholder="仅支持小写字母 a-z、空格与换行……"></textarea>
      </div>

      <div class="arrow" aria-hidden="true">⇄</div>

      <div class="field">
        <label>
          <span>密文</span>
          <span class="tag" id="cipherCount">0 字符</span>
        </label>
        <textarea id="cipherText" spellcheck="false" autocomplete="off"
                  placeholder="密文为数字串，数字之间用空格或换行分隔……"></textarea>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-copy-plain" id="copyPlainBtn">复制原文</button>
      <button class="btn btn-copy-cipher" id="copyCipherBtn">复制密文</button>
      <button class="btn btn-shuffle" id="shuffleBtn">打乱词表</button>
      <button class="btn" id="clearBtn">清空输入</button>
      <button class="btn btn-danger" id="resetBtn">重置词表</button>
    </div>

    <p class="note" id="modeNote">
      每个<strong>首次出现</strong>的单元获得永久递增编号。
      数字模式输出编号；字母模式把编号编码为 a-z；
      中文模式用固定 <strong>20992 字</strong> 的汉字码表逐字对应，一个汉字对应一个密文字符。
      词表<strong>只增不减</strong>，跨模式、跨输入永久累积，并保存在浏览器本地。
      <strong>打乱词表</strong>会重新分配所有编号，旧密文将无法还原，但当前原文会立即生成新密文。
    </p>
  </section>

  <!-- 永久词表 -->
  <section class="card">
    <h2>
      永久词表
      <span class="stat-inline">
        已收录 <b id="wordCount">0</b> 单元 · 下一个编号 <b id="nextId">1</b>
        · 码表容量 <b id="tableSize">0</b> 字
      </span>
    </h2>
    <div class="word-table" id="wordTable"></div>
  </section>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const STORAGE_KEY = 'dict_num_codec_v1';

  /* =========================================================
     中文码表：CJK 统一汉字基本区 U+4E00–U+9FFF，共 20992 字
     覆盖 GB2312 全部 6763 常用/次常用字，远超 3K 需求
     ========================================================= */
  const CODE_TABLE = [];
  for (let cp = 0x4E00; cp <= 0x9FFF; cp++) {
    CODE_TABLE.push(String.fromCharCode(cp));
  }
  const CODE_TABLE_LEN = CODE_TABLE.length;
  const CODE_TABLE_INDEX = new Map(CODE_TABLE.map((c, i) => [c, i + 1]));

  // CJK 基本区汉字正则
  const CJK_RE = /[\u4e00-\u9fff]/;
  const CJK_RE_G = /[^\u4e00-\u9fff]/g;

  const els = {
    plain:        $('plainText'),
    cipher:       $('cipherText'),
    plainCount:   $('plainCount'),
    cipherCount:  $('cipherCount'),
    wordTable:    $('wordTable'),
    wordCount:    $('wordCount'),
    nextId:       $('nextId'),
    tableSize:    $('tableSize'),
    modeNote:     $('modeNote'),
    copyPlainBtn: $('copyPlainBtn'),
    copyCipherBtn:$('copyCipherBtn'),
    shuffleBtn:   $('shuffleBtn'),
    clearBtn:     $('clearBtn'),
    resetBtn:     $('resetBtn'),
    toast:        $('toast')
  };

  const state = {
    mode: 'number',        // 'number' | 'letter' | 'chinese'
    wordToId: new Map(),
    idToWord: new Map(),
    nextId: 1,
    lastEdited: 'plain'
  };

  /* ===== 编号 ↔ 字母：bijective base-26 ===== */
  function lettersFromId(n) {
    let s = '';
    while (n > 0) {
      n--;
      s = String.fromCharCode(97 + (n % 26)) + s;
      n = Math.floor(n / 26);
    }
    return s;
  }

  function idFromLetters(s) {
    let n = 0;
    for (const ch of s) n = n * 26 + (ch.charCodeAt(0) - 97 + 1);
    return n;
  }

  /* ===== 编号 ↔ 中文码表 ===== */
  function chineseFromId(id) {
    return (id >= 1 && id <= CODE_TABLE_LEN) ? CODE_TABLE[id - 1] : '〇';
  }

  function idFromChinese(ch) {
    return CODE_TABLE_INDEX.get(ch) || null;
  }

  /* ===== 编号 → 密文 token ===== */
  function idToToken(id) {
    if (state.mode === 'number') return String(id);
    if (state.mode === 'letter') return lettersFromId(id);
    return chineseFromId(id);
  }

  /* ===== 密文 token → 编号 ===== */
  function tokenToId(tok) {
    if (state.mode === 'number') {
      if (!/^\d+$/.test(tok)) return null;
      return parseInt(tok, 10);
    }
    if (state.mode === 'letter') {
      if (!/^[a-z]+$/.test(tok)) return null;
      return idFromLetters(tok);
    }
    return idFromChinese(tok);
  }

  /* ===== 输入清理 ===== */
  function sanitizePlain(text) {
    if (state.mode === 'chinese') {
      return String(text).replace(CJK_RE_G, '');
    }
    return String(text).toLowerCase().replace(/[^a-z \n]/g, '');
  }

  function sanitizeCipher(text) {
    if (state.mode === 'number') return String(text).replace(/[^0-9 \n]/g, '');
    if (state.mode === 'letter') return String(text).replace(/[^a-z \n]/g, '');
    // 中文模式：密文只保留汉字（无空格、无标点）
    return String(text).replace(CJK_RE_G, '');
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  /* ===== 持久化 ===== */
  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        words: [...state.wordToId.entries()],
        nextId: state.nextId,
        mode: state.mode
      }));
    } catch (e) { /* 忽略存储异常 */ }
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      if (!data || !Array.isArray(data.words)) return;
      state.wordToId = new Map(data.words);
      state.idToWord = new Map();
      for (const [w, id] of state.wordToId) state.idToWord.set(id, w);
      state.nextId = Number(data.nextId) || 1;
      if (['number', 'letter', 'chinese'].includes(data.mode)) state.mode = data.mode;
    } catch (e) { /* 忽略损坏数据 */ }
  }

  /* ===== 中文模式：逐字加密 / 解密 ===== */
  function encryptChinese(text) {
    let out = '';
    for (const ch of text) {
      if (!CJK_RE.test(ch)) continue;

      let id = state.wordToId.get(ch);
      if (id === undefined) {
        // 若编号超出码表容量，说明码表已用尽，直接跳过（理论上 2 万字不会发生）
        if (state.nextId > CODE_TABLE_LEN) continue;
        id = state.nextId++;
        state.wordToId.set(ch, id);
        state.idToWord.set(id, ch);
      }
      out += chineseFromId(id);
    }
    return out;
  }

  function decryptChinese(text) {
    let out = '';
    let unknown = 0;

    for (const ch of text) {
      if (!CJK_RE.test(ch)) continue;

      const id = idFromChinese(ch);
      if (id === null) { out += '?'; unknown++; continue; }

      const word = state.idToWord.get(id);
      // 中文模式下，只有单字汉字才是有效原文；其他（如之前英文模式收的词）标记为未知
      if (word !== undefined && CJK_RE.test(word) && word.length === 1) {
        out += word;
      } else {
        out += '?';
        unknown++;
      }
    }
    return { text: out, unknown };
  }

  /* ===== 英文模式：按空格/换行切词 ===== */
  function encryptEnglish(text) {
    const parts = text.split(/([ \n]+)/);
    let out = '';
    for (const part of parts) {
      if (/^[ \n]+$/.test(part)) { out += part; continue; }
      if (!part.length) continue;

      let id = state.wordToId.get(part);
      if (id === undefined) {
        id = state.nextId++;
        state.wordToId.set(part, id);
        state.idToWord.set(id, part);
      }
      out += idToToken(id);
    }
    return out;
  }

  function decryptEnglish(text) {
    const parts = text.split(/([ \n]+)/);
    let out = '';
    let unknown = 0;
    for (const part of parts) {
      if (/^[ \n]+$/.test(part)) { out += part; continue; }
      if (!part.length) continue;

      const id = tokenToId(part);
      if (id === null) { out += 'unknown'; unknown++; continue; }

      const word = state.idToWord.get(id);
      if (word !== undefined) out += word;
      else { out += 'unknown'; unknown++; }
    }
    return { text: out, unknown };
  }

  /* ===== 统一入口 ===== */
  function encryptText(text) {
    return state.mode === 'chinese' ? encryptChinese(text) : encryptEnglish(text);
  }

  function decryptText(text) {
    return state.mode === 'chinese' ? decryptChinese(text) : decryptEnglish(text);
  }

  /* ===== 刷新界面 ===== */
  function updateAll() {
    els.plainCount.textContent  = els.plain.value.length + ' 字符';
    els.cipherCount.textContent = els.cipher.value.length + ' 字符';
    els.wordCount.textContent   = state.wordToId.size;
    els.nextId.textContent      = state.nextId;
    els.tableSize.textContent   = CODE_TABLE_LEN;
    renderWordTable();
  }

  function renderWordTable() {
    if (state.idToWord.size === 0) {
      els.wordTable.innerHTML = '<div class="empty">词表为空，在原文框输入文本后自动收录</div>';
      return;
    }

    const entries = [...state.idToWord.entries()].sort((a, b) => a[0] - b[0]);
    let html = '';
    for (const [id, word] of entries) {
      let label = '#' + id;
      if (state.mode === 'letter') label += ' · ' + lettersFromId(id);
      if (state.mode === 'chinese') label += ' · ' + chineseFromId(id);
      html += '<div class="word-entry">' +
                '<span class="word-id">' + label + '</span>' +
                '<span class="word-text">' + escapeHtml(word) + '</span>' +
              '</div>';
    }
    els.wordTable.innerHTML = html;
  }

  /* ===== 双向联动 ===== */
  function syncFromPlain() {
    state.lastEdited = 'plain';
    const cleaned = sanitizePlain(els.plain.value);
    if (cleaned !== els.plain.value) els.plain.value = cleaned;

    els.cipher.value = encryptText(cleaned);
    updateAll();
    saveState();
  }

  function syncFromCipher() {
    state.lastEdited = 'cipher';
    const cleaned = sanitizeCipher(els.cipher.value);
    if (cleaned !== els.cipher.value) els.cipher.value = cleaned;

    const result = decryptText(cleaned);
    els.plain.value = result.text;
    updateAll();

    if (result.unknown > 0) {
      toast('有 ' + result.unknown + ' 个字符未收录，已用 ? / unknown 标记');
    }
  }

  /* ===== 模式切换 ===== */
  const MODE_PLACEHOLDERS = {
    number: {
      plain: '仅支持小写字母 a-z、空格与换行……',
      cipher: '密文为数字串，数字之间用空格或换行分隔……'
    },
    letter: {
      plain: '仅支持小写字母 a-z、空格与换行……',
      cipher: '密文为字母串，字母之间用空格或换行分隔……'
    },
    chinese: {
      plain: '仅支持中文汉字，不支持空格与标点……',
      cipher: '密文为汉字码表字符，与原文逐字对应（无空格）……'
    }
  };

  function applyModeUI() {
    document.querySelectorAll('[data-mode]').forEach((b) =>
      b.classList.toggle('active', b.dataset.mode === state.mode));

    const ph = MODE_PLACEHOLDERS[state.mode];
    els.plain.placeholder = ph.plain;
    els.cipher.placeholder = ph.cipher;

    els.plain.classList.toggle('chinese-mode', state.mode === 'chinese');
    els.cipher.classList.toggle('chinese-mode', state.mode === 'chinese');

    if (state.mode === 'chinese') {
      els.modeNote.innerHTML =
        '中文模式下，每个<strong>汉字</strong>视为一个单元，首次出现获得永久递增编号。' +
        '密文取固定码表（<strong>CJK 统一汉字基本区 U+4E00–U+9FFF，共 20992 字</strong>）中第 N 个字符，' +
        '因此<strong>一个汉字对应一个密文字符</strong>，双向可逆。' +
        '原文<strong>只接受汉字</strong>，空格、标点和英文字母会被自动过滤；密文同样只保留汉字。' +
        '词表跨模式共享、只增不减，并保存在浏览器本地。' +
        '<strong>打乱词表</strong>会重新分配所有编号，旧密文将无法还原。';
    } else if (state.mode === 'letter') {
      els.modeNote.innerHTML =
        '每个<strong>首次出现</strong>的单词获得永久递增编号，密文把编号编码为 a-z：' +
        '<strong>1→a、26→z、27→aa…</strong>。' +
        '同一单词始终映射到同一编号；词表<strong>只增不减</strong>，跨多次输入永久累积，并保存在浏览器本地。' +
        '<strong>打乱词表</strong>会重新分配所有编号，旧密文将无法用当前词表还原，但当前原文会立即生成新密文。';
    } else {
      els.modeNote.innerHTML =
        '每个<strong>首次出现</strong>的单词获得永久递增编号：<strong>1, 2, 3 …</strong>，密文直接输出编号。' +
        '同一单词始终映射到同一编号；词表<strong>只增不减</strong>，跨多次输入永久累积，并保存在浏览器本地。' +
        '<strong>打乱词表</strong>会重新分配所有编号，旧密文将无法用当前词表还原，但当前原文会立即生成新密文。';
    }
  }

  function switchMode(mode) {
    if (state.mode === mode) return;
    state.mode = mode;

    applyModeUI();

    // 原文按新模式过滤；密文按新模式重新生成
    const cleaned = sanitizePlain(els.plain.value);
    if (cleaned !== els.plain.value) els.plain.value = cleaned;
    els.cipher.value = encryptText(cleaned);
    state.lastEdited = 'plain';

    updateAll();
    saveState();

    const names = { number: '数字模式', letter: '字母模式', chinese: '中文模式' };
    toast('已切换到' + names[mode]);
  }

  /* ===== 打乱词表 ===== */
  function shuffleWordTable() {
    const words = [...state.idToWord.values()];
    if (words.length < 2) {
      toast('词表太短，无需打乱');
      return;
    }

    for (let i = words.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = words[i]; words[i] = words[j]; words[j] = tmp;
    }

    state.wordToId.clear();
    state.idToWord.clear();
    words.forEach((w, i) => {
      const id = i + 1;
      state.wordToId.set(w, id);
      state.idToWord.set(id, w);
    });
    state.nextId = words.length + 1;

    els.cipher.value = encryptText(els.plain.value);
    state.lastEdited = 'plain';
    saveState();
    updateAll();
    toast('词表已打乱，编号已重新分配');
  }

  /* ===== 提示条 ===== */
  let toastTimer;
  function toast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => els.toast.classList.remove('show'), 2200);
  }

  /* ===== 复制 ===== */
  async function copyValue(el, emptyMsg, okMsg) {
    const text = el.value;
    if (!text) { toast(emptyMsg); return; }
    try {
      await navigator.clipboard.writeText(text);
      toast(okMsg);
    } catch (err) {
      el.select();
      document.execCommand('copy');
      toast(okMsg);
    }
  }

  /* ===== 事件 ===== */
  els.plain.addEventListener('input', syncFromPlain);
  els.cipher.addEventListener('input', syncFromCipher);

  document.querySelectorAll('[data-mode]').forEach((btn) => {
    btn.addEventListener('click', () => switchMode(btn.dataset.mode));
  });

  els.copyPlainBtn.addEventListener('click', () => {
    copyValue(els.plain, '原文为空', '原文已复制');
  });

  els.copyCipherBtn.addEventListener('click', () => {
    copyValue(els.cipher, '密文为空', '密文已复制');
  });

  els.shuffleBtn.addEventListener('click', shuffleWordTable);

  els.clearBtn.addEventListener('click', () => {
    els.plain.value = '';
    els.cipher.value = '';
    state.lastEdited = 'plain';
    updateAll();
    els.plain.focus();
  });

  els.resetBtn.addEventListener('click', () => {
    if (state.wordToId.size === 0 && !els.plain.value && !els.cipher.value) {
      toast('词表已经是空的');
      return;
    }
    if (!confirm('确定要重置词表吗？所有已收录的单元、编号以及当前输入都会被清空。')) return;

    state.wordToId.clear();
    state.idToWord.clear();
    state.nextId = 1;
    els.plain.value = '';
    els.cipher.value = '';
    state.lastEdited = 'plain';
    saveState();
    updateAll();
    toast('词表已重置');
  });

  /* ===== 初始化 ===== */
  loadState();
  applyModeUI();
  updateAll();

  if (els.plain.value) {
    els.plain.value = sanitizePlain(els.plain.value);
    els.cipher.value = encryptText(els.plain.value);
    updateAll();
  }
})();
</script>
</body>
</html>
